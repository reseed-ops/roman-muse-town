name: Tests

# The public web path is the default (the hosted SDK is optional and
# absent on GitHub runners): install from the lockfile, typecheck the
# web line against the SDK shims, run every suite, check the bridge,
# then prove the web build on stand-in assets (the licensed files are
# never in the repo) and smoke-test what it built.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck (web line, SDK shims)
        run: bun run typecheck:web
      - name: Tests (SQLite and Postgres via pglite)
        run: bun run test
      - name: Bridge typecheck
        working-directory: bridge
        run: |
          bun install --frozen-lockfile
          bun run typecheck
      - name: Web build on stand-in assets
        run: |
          bun run web/stubAssets.ts
          bun run build:web
      - name: Build smoke test
        run: bun run smoke:web
