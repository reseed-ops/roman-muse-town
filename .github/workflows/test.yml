name: Tests

# Runs the pure logic only. A full install and typecheck can't run here:
# @hatch/space-sdk resolves to a path inside the Muse runtime. The tested
# modules import no packages, so no install step is needed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run test
